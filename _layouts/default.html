<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: "Peeko" }}</title>
<meta name="description" content="What Peeko, the Android photo search app, reads on your phone and the few things it sends over the internet.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FCFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1C1E" media="(prefers-color-scheme: dark)">
<link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
<style>
/* Colours from brand/peeko/BRAND.md and design.md; every text colour is 4.5:1 or more on its ground. */
:root { --bg: #FCFFFF; --text: #1C1C1E; --secondary: #636366; --link: #04739A; --line: rgba(60,60,67,.18); --fill: rgba(118,118,128,.12); }
@media (prefers-color-scheme: dark) {
  :root { --bg: #1C1C1E; --text: #FFFFFF; --secondary: rgba(235,235,245,.6); --link: #2AA3CF; --line: rgba(84,84,88,.6); }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 1.0625rem/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
header, main { max-width: 680px; margin: 0 auto; padding: 0 20px; }
header { padding-top: 40px; }
header img { display: block; }
main { padding-bottom: 64px; }
h1 { font-size: 2rem; line-height: 1.2; font-weight: 700; margin: 40px 0 4px; }
h1 + p { color: var(--secondary); margin-top: 0; }
h2 { font-size: 1.375rem; line-height: 1.3; font-weight: 700; margin: 48px 0 8px; padding-top: 24px; border-top: 1px solid var(--line); }
h3 { font-size: 1.125rem; line-height: 1.4; font-weight: 600; margin: 32px 0 4px; }
a { color: var(--link); text-underline-offset: 2px; }
code { font: .9em ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--fill); padding: .1em .35em; border-radius: 6px; }
ul { padding-left: 1.25em; }
li { margin: 6px 0; }
</style>
</head>
<body>
<header>
  <picture>
    <source srcset="{{ '/assets/peeko-horizontal-dark.svg' | relative_url }}" media="(prefers-color-scheme: dark)">
    <img src="{{ '/assets/peeko-horizontal.svg' | relative_url }}" alt="Peeko" width="150" height="40">
  </picture>
</header>
<main>
{{ content }}
</main>
</body>
</html>
